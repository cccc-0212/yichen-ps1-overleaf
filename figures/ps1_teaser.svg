<svg xmlns="http://www.w3.org/2000/svg" width="506pt" height="168.6667pt" viewBox="0 0 960 320">
<title>Governed adaptive-tax feedback loop</title><desc>A clockwise loop connects households and firms, approved signals, a bounded AI recommendation, and a human public authority. A central experiment varies explanation and continuation probability to separate trust from strategic learning.</desc>
<defs><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#315EFB"/></marker><marker id="at" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#14877D"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D97745"/></marker></defs>
<text x="480" y="27" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#18324A">Governed adaptive-tax feedback loop</text><rect x="350" y="39" width="260" height="28" rx="14" fill="#D97745" stroke="#B4532A" stroke-width="1.4"/><text x="480" y="58" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">AI recommends  •  humans authorize</text>
<path d="M155 80 V70 H805 V80" fill="none" stroke="#315EFB" stroke-width="2" marker-end="url(#ab)"/><path d="M915 115 H930 V225 H915" fill="none" stroke="#14877D" stroke-width="2" marker-end="url(#at)"/><text x="936" y="170" transform="rotate(90 936 170)" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#18324A">estimate responses</text><path d="M805 260 V275 H155 V260" fill="none" stroke="#14877D" stroke-width="2" marker-end="url(#at)"/><text x="480" y="272" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#18324A">recommend, do not legislate</text><path d="M45 225 H30 V115 H45" fill="none" stroke="#D97745" stroke-width="2" marker-end="url(#ao)"/><text x="22" y="170" transform="rotate(-90 22 170)" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#18324A">public rule &amp; incentives</text>
<rect x="45" y="80" width="220" height="70" rx="10" fill="#EEF2FF" stroke="#315EFB" stroke-width="2"/><text x="155" y="101" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#18324A">HOUSEHOLDS &amp; FIRMS</text><text x="155" y="123" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#18324A">Choose Comply or Avoid</text><text x="155" y="142" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#475569">Private effort and motives</text>
<rect x="695" y="80" width="220" height="70" rx="10" fill="#ECFDF5" stroke="#14877D" stroke-width="2"/><text x="805" y="101" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#18324A">APPROVED SIGNALS</text><text x="805" y="123" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#18324A">Reports, payoffs, prior log</text><text x="805" y="142" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#475569">Limited observability</text>
<rect x="695" y="190" width="220" height="70" rx="10" fill="#ECFDF5" stroke="#14877D" stroke-width="2"/><text x="805" y="211" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#18324A">BOUNDED AI RECOMMENDATION</text><text x="805" y="233" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#18324A">Simulate tax-transfer updates</text><text x="805" y="252" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#475569">Explain evidence and trade-offs</text>
<rect x="45" y="190" width="220" height="70" rx="10" fill="#FFF7ED" stroke="#D97745" stroke-width="2"/><text x="155" y="211" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#18324A">HUMAN PUBLIC AUTHORITY</text><text x="155" y="233" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#18324A">Accept, revise, or reject</text><text x="155" y="252" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#475569">Publish rule, reasons, and appeal</text>
<rect x="330" y="83" width="300" height="165" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/><text x="480" y="109" font-family="DejaVu Sans" font-size="17" font-weight="bold" text-anchor="middle" fill="#18324A">EXPERIMENTAL STRESS TEST</text><rect x="355" y="123" width="250" height="30" rx="15" fill="#EEF2FF" stroke="#A5B4FC"/><text x="480" y="143" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#315EFB">Explanation: transparent  vs  opaque</text><rect x="355" y="160" width="250" height="30" rx="15" fill="#ECFDF5" stroke="#99F6E4"/><text x="480" y="180" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#14877D">Continuation: fixed  vs  probabilistic</text><rect x="355" y="197" width="250" height="30" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="480" y="217" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#9A3412">Separate trust from strategic learning</text>
<rect x="135" y="288" width="690" height="26" rx="7" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4"/><text x="480" y="306" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="middle" fill="#18324A">OBSERVE  →  compliance  •  trust  •  welfare  •  revenue  •  volatility  •  complete event log</text>
</svg>
